name: Atualizar dados

on:
  schedule:
    - cron: '0 10 * * *'  # 7h de Brasília: pega o que foi anunciado à noite
    - cron: '30 21 * * *' # 18h30 de Brasília: depois do fechamento do pregão
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar fiis.json
        run: php atualizar.php

      - name: Publicar
        run: |
          git config user.name "pingou-bot"
          git config user.email "pingou-bot@users.noreply.github.com"
          git add docs/fiis.json
          git diff --cached --quiet || git commit -m "Dados de $(date -u +%F)"
          git push
